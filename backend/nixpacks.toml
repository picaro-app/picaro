[phases.setup]
nixPkgs = [
  "python311",
  "pkg-config",
  "libGL",
  "glib",
  "libxcb",
  "libX11",
  "libXrender",
  "libXext"
]

[phases.install]
cmds = [
  "python3 -m ensurepip",
  "pip3 install --upgrade pip",
  "pip3 install -r requirements.txt"
]

[phases.start]
cmd = "python3 -m uvicorn ai_server:app --host 0.0.0.0 --port $PORT"